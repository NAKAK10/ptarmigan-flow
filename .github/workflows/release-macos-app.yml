name: Build notarized macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            moonshine_platform: macosx_15_0_arm64
            moonshine_source: pypi
          - arch: x86_64
            runner: macos-15-intel
            moonshine_platform: macosx_15_0_x86_64
            moonshine_source: source
    steps:
      - name: Validate Apple release secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout "refs/tags/${{ github.event.release.tag_name || inputs.tag }}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Read Moonshine version
        id: moonshine-version
        run: |
          set -euo pipefail
          MOONSHINE_VER=$(awk -F'"' '/name = "moonshine-voice"/{f=1} f && /version = /{print $2; exit}' uv.lock)
          test -n "$MOONSHINE_VER"
          echo "MOONSHINE_VER=$MOONSHINE_VER" >> "$GITHUB_ENV"
          echo "version=$MOONSHINE_VER" >> "$GITHUB_OUTPUT"

      - name: Checkout Moonshine source
        if: ${{ matrix.moonshine_source == 'source' }}
        uses: actions/checkout@v7
        with:
          repository: moonshine-ai/moonshine
          # Upstream moved the v0.0.49 tag to a rewritten commit that is missing
          # speaker-embedding-model-data.cpp, breaking the source build. Pin the
          # original v0.0.49 commit that shipped in v0.3.14. Re-evaluate when
          # bumping moonshine-voice in uv.lock.
          ref: 15c8bb9412c3db3b78c56e897e6574dbee51a0d2
          lfs: true
          path: moonshine-src

      - name: Install dependencies
        env:
          MOONSHINE_WHEEL_DIR: ${{ runner.temp }}/moonshine-wheel-${{ matrix.arch }}
          MOONSHINE_WHEEL_PLATFORM: ${{ matrix.moonshine_platform }}
          MOONSHINE_SOURCE: ${{ matrix.moonshine_source }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          # moonshine-voice macOS wheels are tagged for macosx_15_0_* while
          # Python may report an older compile-time MACOSX_DEPLOYMENT_TARGET.
          # Build from a minimal release venv and manually repackage the
          # selected wheel as py3-none-any so uv will install the native payload.
          uv venv .release-venv --python 3.11 --managed-python
          uv pip install --python .release-venv/bin/python \
            -r packaging/macos/requirements-release.txt

          rm -rf "$MOONSHINE_WHEEL_DIR"
          mkdir -p "$MOONSHINE_WHEEL_DIR"
          if [ "$MOONSHINE_SOURCE" = "pypi" ]; then
            echo "Fetching moonshine-voice==$MOONSHINE_VER for $MOONSHINE_WHEEL_PLATFORM"
            python3 -m pip download \
              "moonshine-voice==$MOONSHINE_VER" \
              --platform "$MOONSHINE_WHEEL_PLATFORM" --python-version 311 --only-binary :all: \
              -d "$MOONSHINE_WHEEL_DIR"
          elif [ "$MOONSHINE_SOURCE" = "source" ]; then
            echo "Building moonshine-voice==$MOONSHINE_VER from source for ${{ matrix.arch }}"
            moonshine_ort_dir="moonshine-src/core/third-party/onnxruntime/lib/macos/arm64"
            moonshine_ort_dylib="$(find "$moonshine_ort_dir" -maxdepth 1 -name 'libonnxruntime.*.dylib' | sort | head -n 1)"
            test -n "$moonshine_ort_dylib"
            onnxruntime_version="$(basename "$moonshine_ort_dylib")"
            onnxruntime_version="${onnxruntime_version#libonnxruntime.}"
            onnxruntime_version="${onnxruntime_version%.dylib}"
            onnxruntime_url="https://github.com/microsoft/onnxruntime/releases/download/v${onnxruntime_version}/onnxruntime-osx-x86_64-${onnxruntime_version}.tgz"

            curl -L "$onnxruntime_url" -o "$RUNNER_TEMP/onnxruntime-osx-x86_64.tgz"
            tar -xzf "$RUNNER_TEMP/onnxruntime-osx-x86_64.tgz" -C "$RUNNER_TEMP"
            downloaded_ort_dylib="$(find "$RUNNER_TEMP/onnxruntime-osx-x86_64-${onnxruntime_version}/lib" -maxdepth 1 -name 'libonnxruntime.*.dylib' | sort | head -n 1)"
            test -n "$downloaded_ort_dylib"
            cp "$downloaded_ort_dylib" "$moonshine_ort_dylib"

            cmake -B build-moonshine -S moonshine-src/core \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF
            cmake --build build-moonshine --target moonshine -j 4

            moonshine_package_dir="moonshine-src/python/src/moonshine_voice"
            cp build-moonshine/libmoonshine.dylib "$moonshine_package_dir/"
            cp "$moonshine_ort_dylib" "$moonshine_package_dir/"
            uv build --wheel -o "$MOONSHINE_WHEEL_DIR" moonshine-src/python
          else
            echo "::error::Unsupported moonshine source: $MOONSHINE_SOURCE"
            exit 1
          fi

          # Repackage the wheel as py3-none-any with a correct RECORD (sha256 hashes).
          # The dylib content is unchanged; a later validation step checks the
          # installed dylibs before a signed artifact can be uploaded.
          python3 - <<'PYEOF'
          import base64
          import glob
          import hashlib
          import os
          import re
          import zipfile

          def sha256_digest(data: bytes) -> str:
              return "sha256=" + base64.urlsafe_b64encode(hashlib.sha256(data).digest()).decode().rstrip("=")

          wheel_dir = os.environ["MOONSHINE_WHEEL_DIR"]
          src = glob.glob(os.path.join(wheel_dir, "moonshine_voice-*.whl"))[0]
          ver = os.path.basename(src).split("-")[1]
          dst = os.path.join(wheel_dir, f"moonshine_voice-{ver}-py3-none-any.whl")

          files: dict[str, tuple] = {}
          with zipfile.ZipFile(src) as zin:
              for item in zin.infolist():
                  fname = item.filename
                  # libmoonshine.so in the macOS wheel is a Linux ELF (packaging
                  # bug in moonshine-voice <=0.0.59). Exclude it entirely so
                  # PyInstaller never encounters it.
                  if os.path.basename(fname) == "libmoonshine.so":
                      continue
                  data = zin.read(fname)
                  if fname.endswith(".dist-info/WHEEL"):
                      data = re.sub(rb"macosx_[0-9A-Za-z_]+", b"any", data)
                  files[fname] = (item, data)

          record_fname = next(f for f in files if f.endswith("/RECORD"))
          record_lines = []
          for fname, (_, data) in files.items():
              if fname == record_fname:
                  record_lines.append(f"{fname},,")
              else:
                  record_lines.append(f"{fname},{sha256_digest(data)},{len(data)}")
          files[record_fname] = (files[record_fname][0], "\n".join(record_lines).encode())

          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for fname, (item, data) in files.items():
                  zout.writestr(item, data)
          print(f"Created: {dst}")
          PYEOF

          uv pip install --python .release-venv/bin/python \
            "$MOONSHINE_WHEEL_DIR/moonshine_voice-${MOONSHINE_VER}-py3-none-any.whl" \
            --no-deps

      - name: Validate Moonshine native libraries
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          .release-venv/bin/python - <<'PYEOF'
          import os
          import subprocess
          import sys
          from pathlib import Path

          import moonshine_voice

          target_arch = os.environ["TARGET_ARCH"]
          package_dir = Path(moonshine_voice.__file__).resolve().parent
          required = [
              package_dir / "libmoonshine.dylib",
              package_dir / "libonnxruntime.1.23.2.dylib",
          ]
          failed = False
          for path in required:
              if not path.exists():
                  print(f"::error::Moonshine native library missing: {path}")
                  failed = True
                  continue
              result = subprocess.run(
                  ["lipo", "-archs", str(path)],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  print(f"::error::Could not inspect {path}: {result.stderr.strip()}")
                  failed = True
                  continue
              archs = result.stdout.split()
              if target_arch not in archs:
                  available = ", ".join(archs) or "none"
                  print(
                      f"::error::{path} does not contain {target_arch}; "
                      f"available architectures: {available}"
                  )
                  failed = True
              else:
                  print(f"{path.name}: {', '.join(archs)}")
          if failed:
              sys.exit(1)
          PYEOF

      - name: Build PyInstaller app
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
          PYINSTALLER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export APP_VERSION="${TAG_NAME#v}"
          .release-venv/bin/pyinstaller --clean --noconfirm packaging/macos/PtarmiganFlow.spec

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$SIGNING_IDENTITY"
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            dist/PtarmiganFlow.app
          codesign --verify --deep --strict --verbose=2 dist/PtarmiganFlow.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/PtarmiganFlow.app "$RUNNER_TEMP/PtarmiganFlow-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/PtarmiganFlow-notary.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/PtarmiganFlow.app
          xcrun stapler validate dist/PtarmiganFlow.app

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PtarmiganFlow.app \
            "dist/PtarmiganFlow-macos-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PtarmiganFlow-macos-${{ matrix.arch }}
          path: dist/PtarmiganFlow-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() }}
    steps:
      - name: Download signed app artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Validate release artifacts
        run: |
          set -euo pipefail
          # download-artifact skips the per-artifact directory when the run has
          # only one artifact, so locate the zips wherever they landed and
          # normalize into release-assets/.
          mkdir -p release-assets
          for arch in arm64 x86_64; do
            zip_path="$(find artifacts -name "PtarmiganFlow-macos-${arch}.zip" -print -quit)"
            if [ -n "$zip_path" ]; then
              cp "$zip_path" release-assets/
            fi
          done

          if [ ! -f release-assets/PtarmiganFlow-macos-arm64.zip ]; then
            echo "::error::Mandatory arm64 release artifact is missing"
            find artifacts -maxdepth 3 -print
            exit 1
          fi

          if [ ! -f release-assets/PtarmiganFlow-macos-x86_64.zip ]; then
            echo "::warning::Optional x86_64 release artifact is missing"
          fi

      - name: Create draft release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-assets/PtarmiganFlow-macos-*.zip

      - name: Upload assets to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          uploads=()
          arm64="release-assets/PtarmiganFlow-macos-arm64.zip"
          x86_64="release-assets/PtarmiganFlow-macos-x86_64.zip"
          [ -f "$arm64" ] && uploads+=("$arm64")
          [ -f "$x86_64" ] && uploads+=("$x86_64")
          gh release upload "$TAG" "${uploads[@]}" --clobber --repo "${{ github.repository }}"
