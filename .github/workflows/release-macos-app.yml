name: Build notarized macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build arm64 app and draft release
    runs-on: macos-15
    steps:
      - name: Validate Apple release secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout "refs/tags/${{ inputs.tag }}"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          set -euo pipefail
          # moonshine-voice only ships macosx_15_0_* wheels; our Python binary
          # reports macosx_14_0_arm64 (its compile-time MACOSX_DEPLOYMENT_TARGET)
          # even though the runner OS is macOS 15. Build the app from a minimal
          # release venv instead of the full project/dev dependency set, then
          # manually fetch and repackage moonshine-voice as py3-none-any so uv
          # will install it (the dylibs work fine at runtime on macOS 15).
          uv venv .release-venv --python 3.11 --managed-python
          uv pip install --python .release-venv/bin/python \
            -r packaging/macos/requirements-release.txt

          MOONSHINE_VER=$(awk -F'"' '/name = "moonshine-voice"/{f=1} f && /version = /{print $2; exit}' uv.lock)
          echo "Fetching moonshine-voice==$MOONSHINE_VER for macosx_15_0_arm64"

          mkdir -p /tmp/mw
          python3 -m pip download \
            "moonshine-voice==$MOONSHINE_VER" \
            --platform macosx_15_0_arm64 --python-version 311 --only-binary :all: \
            -d /tmp/mw

          # Repackage the wheel as py3-none-any with a correct RECORD (sha256 hashes).
          # The dylib content is unchanged; macOS 15 arm64 runner runs them fine.
          python3 - <<'PYEOF'
          import base64, glob, hashlib, os, zipfile

          def sha256_digest(data: bytes) -> str:
              return "sha256=" + base64.urlsafe_b64encode(hashlib.sha256(data).digest()).decode().rstrip("=")

          src = glob.glob("/tmp/mw/moonshine_voice-*.whl")[0]
          ver = os.path.basename(src).split("-")[1]
          dst = f"/tmp/mw/moonshine_voice-{ver}-py3-none-any.whl"

          files: dict[str, tuple] = {}
          with zipfile.ZipFile(src) as zin:
              for item in zin.infolist():
                  fname = item.filename
                  # libmoonshine.so in the macOS wheel is a Linux ELF (packaging
                  # bug in moonshine-voice <=0.0.59). Exclude it entirely so
                  # PyInstaller never encounters it.
                  if os.path.basename(fname) == "libmoonshine.so":
                      continue
                  data = zin.read(fname)
                  if fname.endswith(".dist-info/WHEEL"):
                      data = data.replace(b"macosx_15_0_universal2", b"any")
                      data = data.replace(b"macosx_15_0_arm64", b"any")
                  files[fname] = (item, data)

          record_fname = next(f for f in files if f.endswith("/RECORD"))
          record_lines = []
          for fname, (_, data) in files.items():
              if fname == record_fname:
                  record_lines.append(f"{fname},,")
              else:
                  record_lines.append(f"{fname},{sha256_digest(data)},{len(data)}")
          files[record_fname] = (files[record_fname][0], "\n".join(record_lines).encode())

          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for fname, (item, data) in files.items():
                  zout.writestr(item, data)
          print(f"Created: {dst}")
          PYEOF

          uv pip install --python .release-venv/bin/python \
            "/tmp/mw/moonshine_voice-${MOONSHINE_VER}-py3-none-any.whl" \
            --no-deps

      - name: Build PyInstaller app
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export APP_VERSION="${TAG_NAME#v}"
          .release-venv/bin/pyinstaller --clean --noconfirm packaging/macos/PtarmiganFlow.spec

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$SIGNING_IDENTITY"
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            dist/PtarmiganFlow.app
          codesign --verify --deep --strict --verbose=2 dist/PtarmiganFlow.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/PtarmiganFlow.app "$RUNNER_TEMP/PtarmiganFlow-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/PtarmiganFlow-notary.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/PtarmiganFlow.app
          xcrun stapler validate dist/PtarmiganFlow.app

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PtarmiganFlow.app \
            dist/PtarmiganFlow-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PtarmiganFlow-macos-arm64
          path: dist/PtarmiganFlow-macos-arm64.zip
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist/PtarmiganFlow-macos-arm64.zip
